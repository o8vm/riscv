name: Temporary official Sail H Lean source relay

on:
  push:
    branches: [sail-v044-public-relay-20260823]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  SAIL_RISCV_REVISION: ac2a585506aad46b088b3594e56b8c21c52e297e
  SAIL_COMPILER_REVISION: 8eb1fb6b5bf9f18c0f89f71e94ff0c5894acd7c1
  SAIL_MODULES: H;Zca;Zicbom_insts;Zicboz;Zicsr_insts;Zkr;Sscofpmf;postlude

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout relay repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build curl pkg-config libgmp-dev zstd opam z3

      - name: Build pinned Sail compiler
        shell: bash
        run: |
          set -euo pipefail
          opam init --yes --no-setup --shell=sh --compiler=5.3.0
          eval "$(opam env)"
          git clone --filter=blob:none https://github.com/rems-project/sail.git sail-compiler
          git -C sail-compiler checkout "$SAIL_COMPILER_REVISION"
          opam install --yes dune
          (cd sail-compiler && opam install --yes . --deps-only)
          make -C sail-compiler install
          test "$(git -C sail-compiler rev-parse HEAD)" = "$SAIL_COMPILER_REVISION"
          sail --version

      - name: Checkout pinned official Sail RISC-V model
        uses: actions/checkout@v5
        with:
          repository: riscv/sail-riscv
          ref: ac2a585506aad46b088b3594e56b8c21c52e297e
          path: sail-riscv
          fetch-depth: 1

      - name: Generate official Lean model with H extension
        shell: bash
        run: |
          set -euo pipefail
          eval "$(opam env)"
          test "$(git -C sail-riscv rev-parse HEAD)" = "$SAIL_RISCV_REVISION"
          cmake -S sail-riscv -B sail-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSAIL_MODULES="$SAIL_MODULES"
          cmake --build sail-build --target generated_lean_rv64d -j2
          test -f sail-build/model/Lean_RV64D/LeanRV64D.lean

      - name: Commit generated source archive
        shell: bash
        run: |
          set -euo pipefail
          PKG=sail-build/model/Lean_RV64D
          rm -rf "$PKG/.lake" "$PKG/build" "$PKG/.git"
          cat > "$PKG/UPSTREAM-PIN.txt" <<EOF
          repository=https://github.com/riscv/sail-riscv
          revision=$SAIL_RISCV_REVISION
          sail_repository=https://github.com/rems-project/sail
          sail_revision=$SAIL_COMPILER_REVISION
          sail_version=0.20.2
          modules=$SAIL_MODULES
          EOF
          find "$PKG" -type f ! -name GENERATED-SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$PKG/GENERATED-SHA256SUMS"
          rm -rf bundle
          mkdir bundle
          cp -a "$PKG" bundle/Lean_RV64D
          cp -a sail-riscv/lean_emulator bundle/official-lean-emulator
          rm -rf bundle/official-lean-emulator/.git bundle/official-lean-emulator/.lake
          find bundle -type f -print0 | sort -z | xargs -0 sha256sum > bundle/BUNDLE-SHA256SUMS
          tar --zstd -cf sail-riscv-H-Lean-ac2a585-source.tar.zst bundle
          sha256sum sail-riscv-H-Lean-ac2a585-source.tar.zst > sail-riscv-H-Lean-ac2a585-source.tar.zst.sha256
          git fetch origin sail-v044-public-relay-20260823
          git checkout -B sail-v044-public-relay-20260823 origin/sail-v044-public-relay-20260823
          rm -rf relay-output
          mkdir relay-output
          cp sail-riscv-H-Lean-ac2a585-source.tar.zst relay-output/
          cp sail-riscv-H-Lean-ac2a585-source.tar.zst.sha256 relay-output/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add relay-output
          git commit -m "ci: store official Sail H generated Lean source [skip ci]"
          git push origin HEAD:sail-v044-public-relay-20260823
